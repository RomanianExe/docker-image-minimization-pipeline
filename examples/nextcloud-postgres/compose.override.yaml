# Pipeline-side compose override, layered on top of the vendor compose file
# (vendor/ is never modified).
#
#   image           - pin the service to the tag currently being processed
#                     (${TARGET_IMAGE} = <name>:original or <name>:slim). For a
#                     PREBUILT example this REPLACES the upstream reference, so
#                     pipeline/build.sh pulls that reference directly rather
#                     than going through `compose pull`.
#   container_name  - stable name the functional tests address.
#   ports !override - remap onto this project's own host-port range (upstream
#                     publishes :80).
#
# nc.volumes is deliberately NOT reset: nc_data is where the entrypoint unpacks
# the application, so removing it would change how the image behaves rather
# than just how the pipeline observes it.
#
# db.image - `postgres:alpine` is unpinned and now resolves to PostgreSQL 18,
#   which relocated PGDATA and refuses to start against a volume mounted at the
#   old /var/lib/postgresql/data — which is what the vendor file mounts. Same
#   pin already applied in spring-postgres, nginx-golang-postgres and
#   gitea-postgres.
#
# db.healthcheck + nc.depends_on - the vendor file declares no ordering between
#   the services, relying on `restart: always`. The pipeline asserts the
#   container is up once STARTUP_WAIT elapses, so the gate makes the run
#   deterministic.
services:
  nc:
    image: ${TARGET_IMAGE}
    container_name: ${IMAGE_NAME}-test
    depends_on:
      db:
        condition: service_healthy
    ports: !override
      - "${HOST_PORT}:${CONTAINER_PORT}"
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 3s
      retries: 10
      start_period: 10s
